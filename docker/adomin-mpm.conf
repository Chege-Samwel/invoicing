# Adomin Technologies — Apache worker sizing for a Render free instance
# (512 MB RAM). php:7.4-apache runs PHP as an Apache module, which means
# mpm_prefork: one process per request, no threads. Every directive below has
# to be valid for the MPM it sits under - MinSpareThreads/MaxSpareThreads are
# event+worker only and make prefork fail with
#   AH00526: Syntax error ... Invalid command 'MinSpareThreads'
# which crash-loops the container, so they are deliberately absent here.

<IfModule mpm_prefork_module>
    ServerLimit              4
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        4
    MaxConnectionsPerChild   3000
</IfModule>

# Only reached if someone swaps in a thread MPM (e.g. a base image without
# libapache2-mod-php). 4 children x 4 threads = 16 simultaneous requests.
<IfModule mpm_event_module>
    ServerLimit              4
    StartServers             1
    ThreadsPerChild          4
    MinSpareThreads          4
    MaxSpareThreads          8
    MaxRequestWorkers        16
    MaxConnectionsPerChild   3000
</IfModule>

<IfModule mpm_worker_module>
    ServerLimit              4
    StartServers             1
    ThreadsPerChild          4
    MinSpareThreads          4
    MaxSpareThreads          8
    MaxRequestWorkers        16
    MaxConnectionsPerChild   3000
</IfModule>
