# ---------------------------------------------------------------------------
# Adomin Technologies — Render Blueprint for this CodeIgniter 3 invoicing app
# ---------------------------------------------------------------------------
# Deliberately on the FREE instance type (plan: free): 512 MB, 0.1 CPU,
# 750 instance hours a month. The app is deployable there because the PDF
# engine no longer needs wkhtmltopdf and no longer calls back into the app
# over HTTP (see application/libraries/AdominPdf.php).
#
# What the free tier costs you, and how this file handles it:
#   * no persistent disk  -> uploads land on the container filesystem and are
#     wiped by every deploy, restart or 15-minute spin down. Everything the app
#     needs at render time (fonts, CSS, the PDF cache) is written to /tmp, so a
#     wipe never breaks a document. For the firm logo, either accept re-upload
#     after a deploy, or commit the logo into
#     attachments/companiesimages/<firm_id>/ so it ships inside the image.
#   * no MySQL on Render   -> point DB_* at a free external MySQL (TiDB
#     Serverless, or a VPS). Render only ships PostgreSQL, which this app
#     cannot use (mysqli + MySQL SQL in database.sql).
#   * sleeps when idle     -> the first request after 15 quiet minutes waits
#     about a minute. The service worker shows offline.html during that wake-up
#     instead of an Apache error page.
#   * no outbound SMTP on ports 25/465/580 -> e-mail is disabled below; use the
#     share-link feature instead, or an HTTPS transactional provider.

services:
  - type: web
    name: adomin-invoices
    runtime: docker
    plan: free
    repo: https://github.com/Chege-Samwel/invoicing
    branch: arena/1a2cbc1e-invoicing
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- database (external MySQL; free tier friendly) ---
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
      # --- pdf ---
      # dompdf = pure PHP: works with no binary, no root, no self HTTP request.
      - key: PDF_ENGINE
        value: dompdf
      - key: ADOMIN_PDF_STAMP
        value: "1"
      # --- personalisation (Adomin Technologies) ---
      - key: ADOMIN_BRAND_NAME
        value: Adomin Technologies
      - key: ADOMIN_BRAND_SHORT
        value: Adomin
      - key: ADOMIN_APP_NAME
        value: Adomin Invoices
      - key: ADOMIN_TAGLINE
        value: Electronic invoicing & warehouse management
      - key: ADOMIN_WEBSITE
        value: https://adomin.co.ke
      - key: ADOMIN_SUPPORT_EMAIL
        value: support@adomin.co.ke
      - key: ADOMIN_ACCENT
        value: "#0b6bcb"
      - key: ADOMIN_THEME_COLOR
        value: "#0b6bcb"
      # --- locale: Kenya first ---
      - key: ADOMIN_TIMEZONE
        value: Africa/Nairobi
      - key: ADOMIN_CURRENCY
        value: KES
      - key: ADOMIN_DATE_FORMAT
        value: d.m.Y
      # --- features ---
      - key: ADOMIN_ANIMATIONS
        value: "1"
      - key: ADOMIN_PWA
        value: "1"
      - key: ADOMIN_SHARE_LINKS
        value: "1"
      - key: ADOMIN_WHATSAPP_CC
        value: "254"
    # NOTE: a persistent disk is intentionally NOT declared - Render rejects it
    # on the free instance type ("disks require a Starter instance or higher").
    # If you later move to plan: starter, add:
    #   disk:
    #     name: adomin-uploads
    #     mountPath: /var/www/html/attachments
    #     sizeGB: 1
