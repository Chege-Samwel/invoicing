# ---------------------------------------------------------------------------
# Adomin Technologies — Render Blueprint for this CodeIgniter 3 invoicing app
# ---------------------------------------------------------------------------
# Deliberately on the FREE instance type (plan: free): 512 MB, 0.1 CPU,
# 750 instance hours a month. The app is deployable there because the PDF
# engine no longer needs wkhtmltopdf and no longer calls back into the app
# over HTTP (see application/libraries/AdominPdf.php).
#
# What the free tier costs you, and how this file handles it:
#   * no persistent disk  -> uploads land on the container filesystem and are
#     wiped by every deploy, restart or 15-minute spin down. Everything the app
#     needs at render time (fonts, CSS, the PDF cache) is written to /tmp, so a
#     wipe never breaks a document. For the firm logo, either accept re-upload
#     after a deploy, or commit the logo into
#     attachments/companiesimages/<firm_id>/ so it ships inside the image.
#   * no MySQL on Render   -> point DB_* at a free external MySQL (TiDB
#     Serverless, or a VPS). Render only ships PostgreSQL, which this app
#     cannot use (mysqli + MySQL SQL in database.sql).
#   * sleeps when idle     -> the first request after 15 quiet minutes waits
#     about a minute. The service worker shows offline.html during that wake-up
#     instead of an Apache error page.
#   * no outbound SMTP on ports 25/465/580 -> e-mail is disabled below; use the
#     share-link feature instead, or an HTTPS transactional provider.

services:
  - type: web
    name: adomin-invoices
    runtime: docker
    plan: free
    # Render uses the repo the Blueprint was created from; pin the branch so a
    # push here redeploys. Drop `branch` to follow the default branch instead.
    branch: arena/1a2cbc1e-invoicing
    dockerfilePath: ./Dockerfile
    # /status is answered by index.php before CodeIgniter boots, so it returns 200
    # even while the database is still unconfigured - which is exactly when the app
    # itself 500s (autoload.php loads the 'database' library on every request, so a
    # dead DB fails every route, not just /). Pointing the health check here keeps
    # Render from treating a "waiting for DB env vars" deploy as a dead instance and
    # restarting it in a loop. The endpoint answers probes from a 30s cache without
    # opening a connection, so it cannot occupy the single CPU; open it in a browser
    # (or add ?refresh=1) for the live self-check with remediation hints.
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      # --- database (external MySQL; free tier friendly) ---
      # DB_NAME must be a schema the app may write to: `sys`, `mysql`,
      # `information_schema` and `performance_schema` connect but then fail every
      # page, so the app refuses them with a readable page instead of a blank 500
      # (DB_ALLOW_SYSTEM_SCHEMA=1 opts out). A fresh TiDB Cloud cluster has no app
      # schema at all - create one (CREATE DATABASE `adomin`) and use that name.
      # TLS needs no key here: hosts that require it (tidbcloud.com,
      # aivencloud.com, planetscale.com, Azure MySQL) are detected by hostname -
      # see BRIEF.md 5.4, and `database.tls` in /status for the decision made.
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
      # ...or paste the host's single connection string instead of the four
      # fields above (individual DB_* values win if both are set):
      #   DATABASE_URL=mysql://user:pass@gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/defaultdb?ssl-mode=REQUIRED
      # Accepted schemes: mysql:// (TiDB Cloud, Aiven, PlanetScale, ClearDB,
      # Railway, MariaDB). A postgresql:// link (Neon, Supabase, Render's own
      # Postgres) is refused at boot with an explanation, because this app
      # speaks MySQL through mysqli - it cannot be repointed at Postgres.
      - key: DATABASE_URL
        sync: false
      # TLS switches - usually not needed, because a host that refuses plaintext
      # (tidbcloud.com, aivencloud.com, planetscale.com, Azure MySQL) turns TLS on
      # by itself. DB_SSL=1 forces it on, DB_SSL=0 forces it off (an explicit value
      # always wins, including over the URL's ?ssl-mode=), DB_SSL_CA=/path/to.pem
      # pins the authority, DB_SSL_VERIFY=1 also requires the certificate to match
      # the hostname. With TLS on and no DB_SSL_CA, the system bundle is used.
      - key: DB_SSL
        value: ""
      # --- pdf ---
      # dompdf = pure PHP: works with no binary, no root, no self HTTP request.
      - key: PDF_ENGINE
        value: dompdf
      - key: ADOMIN_PDF_STAMP
        value: "1"
      # --- personalisation (Adomin Technologies) ---
      - key: ADOMIN_BRAND_NAME
        value: Adomin Technologies
      - key: ADOMIN_BRAND_SHORT
        value: Adomin
      - key: ADOMIN_APP_NAME
        value: Adomin Invoices
      - key: ADOMIN_TAGLINE
        value: Electronic invoicing & warehouse management
      - key: ADOMIN_WEBSITE
        value: https://adomin.co.ke
      - key: ADOMIN_SUPPORT_EMAIL
        value: support@adomin.co.ke
      - key: ADOMIN_ACCENT
        value: "#0b6bcb"
      - key: ADOMIN_THEME_COLOR
        value: "#0b6bcb"
      # --- locale: Kenya first ---
      - key: ADOMIN_TIMEZONE
        value: Africa/Nairobi
      - key: ADOMIN_CURRENCY
        value: KES
      - key: ADOMIN_DATE_FORMAT
        value: d.m.Y
      # --- features ---
      - key: ADOMIN_ANIMATIONS
        value: "1"
      - key: ADOMIN_PWA
        value: "1"
      - key: ADOMIN_SHARE_LINKS
        value: "1"
      # --- diagnosis (both empty by default: add the value in the UI when needed) ---
      # ADOMIN_DEBUG=1 boots CodeIgniter in the `development` environment so a page
      # shows the real error (and db_debug prints the MySQL error) instead of the
      # generic production page. Remove it as soon as you are done - it is a
      # diagnostic, not a setting to run a customer-facing site with.
      - key: ADOMIN_DEBUG
        sync: false
      # ADOMIN_STATUS=0 turns the /status self-check off. It prints no credentials -
      # only host/port/database names, extension and writability facts - so it is
      # safe to leave on, but it is your call.
      - key: ADOMIN_STATUS
        sync: false
      # /setup imports database.sql and database/adomin-updates.sql into the schema
      # above, for a first install that has no MySQL client (Render free tier gives
      # you no shell). It does nothing while this variable is empty, so the default
      # state is "off": set it to any private string of 8+ characters, open /setup,
      # type the value in, run the batches, then DELETE the variable.
      - key: ADOMIN_SETUP_KEY
        sync: false
    # NOTE: a persistent disk is intentionally NOT declared - Render rejects it
    # on the free instance type ("disks require a Starter instance or higher").
    # If you later move to plan: starter, add:
    #   disk:
    #     name: adomin-uploads
    #     mountPath: /var/www/html/attachments
    #     sizeGB: 1
